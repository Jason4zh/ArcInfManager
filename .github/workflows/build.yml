name: build
on:
  workflow_dispatch:
    inputs:
      url:
        description: tmpfiles page url
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch source
        run: |
          DL=$(wget -qO- "${{ inputs.url }}" | grep -o 'https://tmpfiles.org/dl/[^"]*' | head -1)
          echo "DL=$DL"
          wget -q "$DL" -O src.zip
          unzip -q src.zip -d src
          ls src | head
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: gradle
        run: |
          cd src
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          set +e
          ./gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace > ../build.log 2>&1
          echo "EXIT=$?" >> ../build.log
      - name: errors
        if: always()
        run: |
          echo '=== errors ==='
          grep -n -m 80 'e: ' build.log || true
      - name: tail
        if: always()
        run: tail -40 build.log
      - name: release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build ${{ github.run_number }}
          fail_on_unmatched_files: false
          files: |
            build.log
            src/app/build/outputs/apk/debug/app-debug.apk